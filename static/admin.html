<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Chatbot - Admin</title>
<style>
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:#f6f7f9; color:#1c2330; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:18px; } h2 { font-size:15px; margin-top:28px; }
  input { font:inherit; padding:8px 10px; border:1px solid #e2e5ea; border-radius:6px; }
  button { padding:8px 16px; border:0; border-radius:6px; background:#0f766e; color:#fff; font:inherit; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e2e5ea; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #e2e5ea; vertical-align:top; }
  th { font-size:12px; color:#667085; }
  tr.clickable { cursor:pointer; } tr.clickable:hover { background:#f0fdfa; }
  .flag { background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:10px; font-size:12px; white-space:nowrap; }
  .status { color:#667085; margin-left:10px; }
  #transcript { background:#fff; border:1px solid #e2e5ea; padding:14px; margin-top:10px; display:none; }
  .line { margin-bottom:8px; white-space:pre-wrap; } .line b { display:inline-block; width:80px; color:#667085; font-weight:500; }
  .tool { color:#667085; font-family:ui-monospace, monospace; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin</h1>
  <p><input id="token" type="password" placeholder="Admin token"> <button id="load">Load</button><span id="status" class="status"></span></p>

  <h2>Conversations <small>(click a row to read it)</small></h2>
  <table><thead><tr><th>#</th><th>Channel</th><th>Status</th><th>Messages</th><th>Last customer message</th><th>Started</th></tr></thead><tbody id="conversations"></tbody></table>
  <div id="transcript"></div>

  <h2>Appointments</h2>
  <table><thead><tr><th>Date</th><th>Time</th><th>Service</th><th>Name</th><th>Phone</th><th>Code</th></tr></thead><tbody id="appointments"></tbody></table>

  <h2>Leads</h2>
  <table><thead><tr><th>Name</th><th>Contact</th><th>Note</th><th>Saved</th></tr></thead><tbody id="leads"></tbody></table>
</div>
<script>
const status = document.getElementById('status');
async function api(path) {
  const res = await fetch(path, { headers: { 'X-Admin-Token': document.getElementById('token').value } });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Request failed');
  return res.json();
}
function row(cells, onClick) {
  const tr = document.createElement('tr');
  for (const c of cells) {
    const td = document.createElement('td');
    if (c instanceof Node) td.append(c); else td.textContent = c ?? '';
    tr.append(td);
  }
  if (onClick) { tr.className = 'clickable'; tr.addEventListener('click', onClick); }
  return tr;
}
function fill(id, rows) { document.getElementById(id).replaceChildren(...rows); }

async function showTranscript(id) {
  const box = document.getElementById('transcript');
  const { messages } = await api('/admin/api/conversations/' + id);
  box.replaceChildren();
  for (const m of messages) {
    const line = document.createElement('div');
    line.className = 'line' + (m.role === 'tool' ? ' tool' : '');
    const who = document.createElement('b');
    who.textContent = m.role;
    line.append(who, document.createTextNode(m.content));
    box.append(line);
  }
  box.style.display = 'block';
}

async function load() {
  try {
    const data = await api('/admin/api/overview');
    fill('conversations', data.conversations.map(c => {
      let state = 'Handled by assistant';
      if (c.needs_human) { state = document.createElement('span'); state.className = 'flag'; state.textContent = 'Needs a person: ' + c.handoff_reason; }
      return row([c.id, c.channel, state, c.messages, c.last_user_message, c.created_at], () => showTranscript(c.id));
    }));
    fill('appointments', data.appointments.map(a => row([a.date, a.time, a.service, a.name, a.phone, a.code])));
    fill('leads', data.leads.map(l => row([l.name, l.contact, l.note, l.created_at])));
    status.textContent = 'Loaded';
  } catch (e) { status.textContent = e.message; }
}
document.getElementById('load').addEventListener('click', load);
</script>
</body>
</html>
